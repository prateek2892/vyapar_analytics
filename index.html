<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StratGO Consulting</title>
<meta name="description" content="StratGO Consulting — Strategy, Operations, Analytics, Transformation, IT and Management Advisory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--bg2:#131922;--bg3:#1A2332;
  --gold:#C9A84C;--gold-l:#E0BC6A;--gold-d:#A8883A;
  --white:#fff;--off:#F3F1EC;--gray:#7A8AA8;--text:#1C2333;--border:#2A3548;
  --light-border:#E2DDD4;
  --shadow-sm:0 2px 12px rgba(0,0,0,.15);
  --shadow-md:0 8px 32px rgba(0,0,0,.25);
  --shadow-lg:0 20px 56px rgba(0,0,0,.35);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal.v{opacity:1;transform:none}
.reveal-l{opacity:0;transform:translateX(-24px);transition:opacity .6s .08s cubic-bezier(.22,1,.36,1),transform .6s .08s cubic-bezier(.22,1,.36,1)}
.reveal-l.v{opacity:1;transform:none}
.d1{transition-delay:.05s!important}.d2{transition-delay:.12s!important}.d3{transition-delay:.19s!important}
.d4{transition-delay:.26s!important}.d5{transition-delay:.33s!important}.d6{transition-delay:.40s!important}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .35s,box-shadow .35s}
nav.top{background:transparent}
nav.scrolled{background:rgba(13,17,23,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(201,168,76,.18),var(--shadow-md)}
.nav-i{max-width:1200px;margin:0 auto;padding:0 36px;height:66px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Playfair Display',serif;font-size:1.42rem;font-weight:700;color:#fff;letter-spacing:.02em}
.logo .go{color:var(--gold)}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-links a{font-size:.78rem;font-weight:500;color:rgba(255,255,255,.62);letter-spacing:.08em;text-transform:uppercase;transition:color .2s;padding-bottom:2px;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .28s}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{transform:scaleX(1)}
/* FIX 1: clean contact button - no weird border */
.nav-cta{background:var(--gold);color:var(--bg);padding:8px 20px;font-weight:700;border-radius:0;letter-spacing:.06em;box-shadow:0 3px 14px rgba(201,168,76,.35);transition:background .2s,box-shadow .2s,transform .15s}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--gold-l);color:var(--bg);box-shadow:0 5px 20px rgba(201,168,76,.5);transform:translateY(-1px)}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:5px;background:none;border:none}
.burger span{display:block;width:22px;height:2px;background:#fff;transition:.28s;transform-origin:center}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mob{display:none;position:fixed;top:66px;left:0;right:0;background:rgba(13,17,23,.97);backdrop-filter:blur(18px);padding:20px 36px 28px;border-bottom:1px solid rgba(201,168,76,.18);z-index:199}
.mob a{display:block;padding:12px 0;font-size:.86rem;font-weight:500;color:rgba(255,255,255,.72);border-bottom:1px solid rgba(255,255,255,.05);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.mob a:last-child{border:none;color:var(--gold);font-weight:700;margin-top:6px}

/* HERO */
.hero{background:var(--bg);padding:130px 36px 90px;min-height:90vh;display:flex;align-items:center;position:relative;overflow:hidden}
.h-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px)}
.h-orb-1{width:600px;height:600px;top:-20%;right:-10%;background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 65%);animation:float1 9s ease-in-out infinite}
.h-orb-2{width:350px;height:350px;bottom:-5%;left:-5%;background:radial-gradient(circle,rgba(26,35,50,.9) 0%,transparent 70%);animation:float2 11s ease-in-out infinite}
.h-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:56px 56px;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
.hero-i{max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:26px;opacity:0;animation:fadeUp .7s .2s forwards}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:28px;height:1px;background:var(--gold)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,6vw,4.8rem);font-weight:700;line-height:1.08;color:#fff;max-width:780px;margin-bottom:24px;opacity:0;animation:fadeUp .7s .38s forwards}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:1rem;font-weight:300;line-height:1.82;color:rgba(255,255,255,.54);max-width:520px;margin-bottom:44px;opacity:0;animation:fadeUp .7s .56s forwards}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fadeUp .7s .72s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.scroll-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;animation:fadeUp .7s 1.3s forwards}
.scroll-hint span{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.scroll-mouse{width:20px;height:30px;border:1.5px solid rgba(255,255,255,.3);border-radius:10px;position:relative}
.scroll-mouse::after{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:2px;height:6px;background:var(--gold);border-radius:2px;animation:sdot 1.8s ease-in-out infinite}
@keyframes sdot{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}80%{transform:translateX(-50%) translateY(10px);opacity:0}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--gold);color:var(--bg);font-size:.84rem;font-weight:700;padding:13px 28px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;font-family:inherit;position:relative;overflow:hidden;transition:background .2s,box-shadow .25s,transform .15s}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);transition:transform .45s}
.btn:hover::before{transform:translateX(100%)}
.btn:hover{background:var(--gold-l);box-shadow:0 6px 28px rgba(201,168,76,.45);transform:translateY(-2px)}
.btn .arr{transition:transform .25s}
.btn:hover .arr{transform:translateX(4px)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.28);box-shadow:none}
.btn-ghost::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.btn-ghost:hover{background:rgba(255,255,255,.05);box-shadow:none;border-color:rgba(255,255,255,.45)}

/* STATS */
.stats{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);padding:0 36px;border-top:1px solid rgba(201,168,76,.15)}
.stats-i{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;padding:40px 16px;border-right:1px solid var(--border);position:relative;transition:background .25s}
.stat:last-child{border-right:none}
.stat::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--gold);transition:width .35s}
.stat:hover::after{width:50%}
.stat:hover{background:rgba(255,255,255,.025)}
.stat-v{font-family:'Playfair Display',serif;font-size:2.7rem;font-weight:700;color:var(--gold);line-height:1}
.stat-l{font-size:.66rem;font-weight:600;color:rgba(255,255,255,.38);letter-spacing:.12em;text-transform:uppercase;margin-top:8px}

/* SECTIONS */
section{padding:84px 36px}
.si{max-width:1200px;margin:0 auto}
.sec-ey{font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-ey::before{content:'';display:block;width:22px;height:1px;background:var(--gold)}
.sec-h{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,3.5vw,2.7rem);font-weight:700;line-height:1.2;color:var(--text);margin-bottom:16px}

/* SERVICES — FIX 3: fully dynamic grid */
#services{background:var(--white);position:relative}
#services::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.svc-header{margin-bottom:48px}
/* Grid auto-adjusts based on count via JS class */
.svc-grid{display:grid;gap:0}
.svc-grid.cols-1{grid-template-columns:1fr}
.svc-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.svc-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.svc-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.svc-card{padding:36px 30px;border:1px solid var(--light-border);margin:-1px 0 0 -1px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,background .25s;background:var(--white)}
.svc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.svc-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);z-index:1;background:#FEFDFB}
.svc-card:hover::before{transform:scaleX(1)}
.svc-n{font-size:.63rem;font-weight:700;color:var(--gold);letter-spacing:.14em;margin-bottom:18px;opacity:.7}
.svc-t{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:11px;line-height:1.3;transition:color .2s}
.svc-card:hover .svc-t{color:var(--gold-d)}
.svc-d{font-size:.84rem;line-height:1.8;color:var(--gray)}
.svc-line{display:block;width:26px;height:2px;background:var(--gold);margin-top:22px;transition:width .35s}
.svc-card:hover .svc-line{width:52px}

/* ABOUT — FIX 4: photo support */
.about-bg{background:var(--off);position:relative}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.fc{background:var(--white);padding:36px 32px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.fc:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.fc-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.fc-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.fc-ini{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--bg) 0%,var(--bg3) 100%);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--gold);flex-shrink:0;border:2px solid var(--gold)}
.fc-head{}
.fc-name{font-family:'Playfair Display',serif;font-size:1.28rem;font-weight:700;color:var(--text)}
.fc-role{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.fc-divider{width:100%;height:1px;background:var(--light-border);margin:18px 0}
.fc-bio{font-size:.86rem;line-height:1.82;color:var(--gray);margin-bottom:22px}
.li-btn{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;color:var(--text);border:1.5px solid var(--text);padding:8px 16px;letter-spacing:.05em;text-transform:uppercase;transition:all .25s;position:relative;overflow:hidden}
.li-btn::before{content:'';position:absolute;inset:0;background:var(--bg);transform:scaleX(0);transform-origin:left;transition:transform .28s}
.li-btn:hover::before{transform:scaleX(1)}
.li-btn:hover{color:#fff;border-color:var(--bg)}
.li-btn>*{position:relative;z-index:1}
.li-icon{width:14px;height:14px;fill:currentColor;flex-shrink:0}

/* WHY */
.why-bg{background:linear-gradient(145deg,var(--bg) 0%,#0a1020 100%);position:relative;overflow:hidden}
.why-bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.025) 1px,transparent 1px);background-size:48px 48px}
.why-bg .sec-h{color:#fff}
.why-bg .sec-ey::before{background:var(--gold)}
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:44px;border:1px solid rgba(255,255,255,.07)}
.wi{padding:40px 36px;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;transition:background .25s}
.wi::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--gold);transition:height .35s}
.wi:hover{background:rgba(255,255,255,.03)}
.wi:hover::before{height:100%}
.wi:nth-child(2n){border-right:none}
.wi:nth-child(3),.wi:nth-child(4){border-bottom:none}
.wi-num{font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:700;color:rgba(201,168,76,.09);line-height:1;margin-bottom:14px}
.wi-l{font-size:.67rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.wi-t{font-size:.88rem;line-height:1.84;color:rgba(255,255,255,.5)}

/* CONTACT */
#contact{background:var(--off);padding:84px 36px}
.contact-box{background:linear-gradient(140deg,var(--bg) 0%,#0e1929 60%,#152030 100%);padding:68px 60px;display:flex;align-items:center;justify-content:space-between;gap:48px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.contact-box::before{content:'';position:absolute;top:-80px;right:-80px;width:320px;height:320px;background:radial-gradient(circle,rgba(201,168,76,.07) 0%,transparent 65%);pointer-events:none}
.contact-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.cl{max-width:520px;position:relative;z-index:1}
.cl .sec-h{color:#fff;margin-bottom:12px}
.cl .sec-ey::before{background:var(--gold)}
.c-sub{font-size:.92rem;line-height:1.8;color:rgba(255,255,255,.5)}
.c-note{display:flex;align-items:center;gap:8px;font-size:.72rem;color:rgba(255,255,255,.28);margin-top:16px}
.c-note::before{content:'';display:block;width:14px;height:1px;background:rgba(255,255,255,.18)}
.contact-cta{position:relative;z-index:1;flex-shrink:0}
.btn-pulse{position:relative}
.btn-pulse::after{content:'';position:absolute;inset:-5px;border:1px solid rgba(201,168,76,.35);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.05);opacity:.9}}

/* FOOTER */
footer{background:#070D18;padding:40px 36px;border-top:1px solid rgba(201,168,76,.14)}
.fi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.fl{font-family:'Playfair Display',serif;font-size:1.18rem;font-weight:700;color:#fff}
.fl .go{color:var(--gold)}
.ft{font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.24);margin-top:5px}
.fc-copy{font-size:.7rem;color:rgba(255,255,255,.24)}
.f-links{display:flex;gap:22px}
.f-links a{font-size:.72rem;color:rgba(255,255,255,.28);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.f-links a:hover{color:var(--gold)}

/* RESPONSIVE */
@media(max-width:960px){
  .nav-links{display:none}.burger{display:flex}
  .stats-i{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}.stat:nth-child(3){border-right:1px solid var(--border)}
  .about-grid{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr}
  .wi{border-right:none!important;border-bottom:1px solid rgba(255,255,255,.07)!important}
  .wi:last-child{border-bottom:none!important}
  .contact-box{flex-direction:column;padding:48px 36px;text-align:center}
  .c-note{justify-content:center}
  .svc-grid.cols-3,.svc-grid.cols-4{grid-template-columns:repeat(2,1fr)}
  section{padding:72px 28px}
}
@media(max-width:600px){
  .hero{padding:118px 24px 84px}
  section{padding:64px 20px}
  .contact-box{padding:40px 24px}
  .stats-i{grid-template-columns:repeat(2,1fr)}
  .svc-grid.cols-2,.svc-grid.cols-3,.svc-grid.cols-4{grid-template-columns:1fr}
  .fi{flex-direction:column;text-align:center;gap:14px}
  .f-links{justify-content:center}
}
</style>
</head>
<body>
<nav class="top" id="nav">
  <div class="nav-i">
    <a href="#home" class="logo">Strat<span class="go">GO</span></a>
    <div class="nav-links">
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#why">Why Us</a>
      <a href="#contact" class="nav-cta">Contact Us</a>
    </div>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>
<div class="mob" id="mob">
  <a href="#services" onclick="cM()">Services</a>
  <a href="#about" onclick="cM()">About</a>
  <a href="#why" onclick="cM()">Why Us</a>
  <a href="#contact" onclick="cM()">Contact Us →</a>
</div>
<div id="app"></div>
<script>
const D={
  meta:{title:"StratGO Consulting"},
  hero:{eyebrow:"Management Consulting",headline:"We Transform Businesses Into Market Leaders",sub:"StratGO Consulting partners with organizations to solve their most complex challenges, unlock growth, and build enduring competitive advantage.",cta:"Start a Conversation"},

      {name:"Kshitij Rohilla",role:"Co-Founder & Managing Partner",bio:"An operations and analytics expert who bridges the gap between data-driven insight and practical execution. Kshitij specializes in turning complex, ambiguous problems into scalable, repeatable solutions.",linkedin:"https://www.linkedin.com/in/kshitijrohilla/",photo:""}

const LI='<svg class="li-icon" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';

function ini(n){return n.split(' ').map(w=>w[0]).join('')}

/* Dynamic grid class based on service count */
function gridCls(n){
  if(n<=2)return'cols-'+n;
  if(n<=4)return n===4?'cols-4':'cols-3';
  return'cols-3';
}

function render(c){
  document.title=c.meta.title;
  const hl=c.hero.headline.replace('Market Leaders','<em>Market Leaders</em>');
  const n=c.services.length;

  document.getElementById('app').innerHTML=`
<section class="hero" id="home">
  <div class="h-orb h-orb-1"></div><div class="h-orb h-orb-2"></div>
  <div class="h-grid"></div>
  <div class="hero-i">
    <div class="eyebrow">${c.hero.eyebrow}</div>
    <h1>${hl}</h1>
    <p class="hero-sub">${c.hero.sub}</p>
    <div class="hero-btns">
      <a href="#contact" class="btn"><span>${c.hero.cta}</span><span class="arr">→</span></a>
      <a href="#services" class="btn btn-ghost"><span>Our Services</span></a>
    </div>
  </div>
  <div class="scroll-hint"><div class="scroll-mouse"></div><span>Scroll</span></div>
</section>

<div class="stats"><div class="stats-i">
  ${c.stats.map(s=>`<div class="stat reveal"><div class="stat-v">${s.value}</div><div class="stat-l">${s.label}</div></div>`).join('')}
</div></div>

<section id="services">
  <div class="si">
    <div class="svc-header reveal">
      <div class="sec-ey">What We Do</div>
      <h2 class="sec-h">Our Services</h2>
    </div>
    <div class="svc-grid ${gridCls(n)}">
      ${c.services.map((s,i)=>`
      <div class="svc-card reveal d${Math.min(i+1,6)}">
        <div class="svc-n">${String(i+1).padStart(2,'0')}</div>
        <div class="svc-t">${s.title}</div>
        <div class="svc-d">${s.desc}</div>
        <span class="svc-line"></span>
      </div>`).join('')}
    </div>
  </div>
</section>

<section class="about-bg" id="about">
  <div class="si">
    <div class="reveal"><div class="sec-ey">Our Firm</div><h2 class="sec-h">About StratGO</h2></div>
    <p class="reveal" style="font-size:.96rem;line-height:1.85;color:var(--gray);max-width:680px;margin-bottom:0;border-left:3px solid var(--gold);padding-left:20px">${c.about.intro}</p>
    <div class="about-grid">
      ${c.about.founders.map((f,i)=>`
      <div class="fc reveal d${i+1}">
        <div class="fc-top">
          ${f.photo?`<img src="${f.photo}" alt="${f.name}" class="fc-photo">`:`<div class="fc-ini">${ini(f.name)}</div>`}
          <div class="fc-head"><div class="fc-name">${f.name}</div><div class="fc-role">${f.role}</div></div>
        </div>
        <div class="fc-divider"></div>
        <p class="fc-bio">${f.bio}</p>
        <a href="${f.linkedin}" target="_blank" rel="noopener" class="li-btn">${LI}<span>View on LinkedIn</span></a>
      </div>`).join('')}
    </div>
  </div>
</section>

<section class="why-bg" id="why">
  <div class="si">
    <div class="reveal"><div class="sec-ey">Our Difference</div><h2 class="sec-h">Why StratGO</h2></div>
    <div class="why-grid">
      ${c.why.map((w,i)=>`
      <div class="wi reveal d${i+1}">
        <div class="wi-num">0${i+1}</div>
        <div class="wi-l">${w.label}</div>
        <div class="wi-t">${w.text}</div>
      </div>`).join('')}
    </div>
  </div>
</section>

<section id="contact">
  <div class="si">
    <div class="contact-box reveal">
      <div class="cl">
        <div class="sec-ey">Get In Touch</div>
        <h2 class="sec-h">${c.contact.heading}</h2>
        <p class="c-sub">${c.contact.sub}</p>
        <p class="c-note">We review every submission and respond within 24 hours.</p>
      </div>
      <div class="contact-cta">
        <a href="${c.contact.formUrl}" target="_blank" rel="noopener" class="btn btn-pulse">
          <span>${c.contact.formCta}</span><span class="arr">→</span>
        </a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="fi">
    <div><div class="fl">Strat<span class="go">GO</span></div><div class="ft">${c.footer.tagline}</div></div>
    <div class="f-links"><a href="#services">Services</a><a href="#about">About</a><a href="#contact">Contact</a></div>
    <div class="fc-copy">© ${c.footer.copy}</div>
  </div>
</footer>`;

  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

window.addEventListener('scroll',()=>{
  document.getElementById('nav').className=scrollY>50?'scrolled':'top';
},{passive:true});

document.getElementById('burger').onclick=function(){
  this.classList.toggle('open');
  document.getElementById('mob').style.display=document.getElementById('mob').style.display==='block'?'none':'block';
};
function cM(){document.getElementById('mob').style.display='none';document.getElementById('burger').classList.remove('open');}

(async()=>{
  let c=D;
  try{const r=await fetch('content.json?v='+Date.now());if(r.ok)c=await r.json();}catch(e){}
  render(c);
})();
</script>
</body>
</html>
