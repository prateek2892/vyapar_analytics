<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StratGO Consulting</title>
<meta name="description" content="StratGO Consulting — Strategy, Operations, Analytics, Transformation, IT and Management Advisory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1426;--navy2:#152040;--gold:#BFA054;--gold-l:#D4B76A;
  --white:#fff;--off:#F5F3EE;--gray:#6B7A99;--text:#1A2233;--border:#E8E4DA;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--white);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--navy);border-bottom:1px solid rgba(191,160,84,.2)}
.nav-i{max-width:1200px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:#fff;letter-spacing:.02em}
.logo span{color:var(--gold)}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-links a{font-size:.83rem;font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.nav-cta{background:var(--gold)!important;color:var(--navy)!important;padding:9px 22px;font-weight:600!important;transition:background .2s!important}
.nav-cta:hover{background:var(--gold-l)!important}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.burger span{display:block;width:24px;height:2px;background:#fff;transition:.3s}
.mob{display:none;position:fixed;top:68px;left:0;right:0;background:var(--navy);padding:20px 32px;border-bottom:1px solid rgba(191,160,84,.2);z-index:99}
.mob a{display:block;padding:12px 0;font-size:.88rem;font-weight:500;color:rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.07);letter-spacing:.05em;text-transform:uppercase}
.mob a:last-child{border:none;color:var(--gold);font-weight:600}

/* HERO */
.hero{background:var(--navy);padding:140px 32px 100px;min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30%;right:-8%;width:550px;height:550px;background:radial-gradient(circle,rgba(191,160,84,.07) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-i{max-width:1200px;margin:0 auto;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.72rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:28px}
.eyebrow::before{content:'';display:block;width:32px;height:1px;background:var(--gold)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,6vw,4.8rem);font-weight:700;line-height:1.1;color:#fff;max-width:780px;margin-bottom:28px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:1.05rem;font-weight:300;line-height:1.8;color:rgba(255,255,255,.6);max-width:540px;margin-bottom:48px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--navy);font-size:.88rem;font-weight:600;padding:14px 30px;letter-spacing:.04em;cursor:pointer;transition:background .2s,transform .15s;border:none;font-family:inherit}
.btn:hover{background:var(--gold-l);transform:translateY(-1px)}
.btn::after{content:'→';font-size:.95rem}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-outline:hover{background:rgba(255,255,255,.06);transform:none}
.btn-outline::after{content:''}

/* STATS */
.stats{background:var(--navy2);padding:44px 32px;border-top:1px solid rgba(191,160,84,.15)}
.stats-i{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;padding:20px 16px;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:none}
.stat-v{font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:700;color:var(--gold);line-height:1}
.stat-l{font-size:.72rem;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}

/* SECTIONS */
section{padding:96px 32px}
.si{max-width:1200px;margin:0 auto}
.sec-ey{font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.sec-h{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,2.9rem);font-weight:700;line-height:1.2;color:var(--navy);margin-bottom:18px}
.sec-sub{font-size:.95rem;line-height:1.8;color:var(--gray);max-width:560px}

/* SERVICES */
.svc-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:52px;gap:32px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.svc-card{background:var(--white);padding:38px 30px;transition:background .2s}
.svc-card:hover{background:var(--off)}
.svc-n{font-size:.68rem;font-weight:600;color:var(--gold);letter-spacing:.1em;margin-bottom:18px;opacity:.8}
.svc-t{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:600;color:var(--navy);margin-bottom:12px;line-height:1.3}
.svc-d{font-size:.87rem;line-height:1.78;color:var(--gray)}
.svc-line{display:block;width:28px;height:2px;background:var(--gold);margin-top:22px;transition:width .3s}
.svc-card:hover .svc-line{width:52px}

/* ABOUT */
.about-bg{background:var(--off)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:52px}
.fc{background:var(--white);padding:38px 34px;border-bottom:3px solid var(--gold)}
.fc-ini{width:54px;height:54px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--gold);margin-bottom:22px}
.fc-name{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--navy);margin-bottom:4px}
.fc-role{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.fc-bio{font-size:.88rem;line-height:1.82;color:var(--gray);margin-bottom:22px}
.li-btn{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--navy);border:1.5px solid var(--navy);padding:9px 16px;letter-spacing:.04em;transition:all .2s}
.li-btn:hover{background:var(--navy);color:#fff}
.li-icon{width:15px;height:15px;fill:currentColor;flex-shrink:0}

/* WHY */
.why-bg{background:var(--navy)}
.why-bg .sec-h{color:#fff}
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:52px;border:1px solid rgba(255,255,255,.1)}
.wi{padding:40px;border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.wi:nth-child(2n){border-right:none}
.wi:nth-child(3),.wi:nth-child(4){border-bottom:none}
.wi-l{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.wi-t{font-size:.9rem;line-height:1.82;color:rgba(255,255,255,.55)}

/* CONTACT */
.contact-box{background:var(--navy);padding:72px 64px;display:flex;align-items:center;justify-content:space-between;gap:48px}
.cl{max-width:560px}
.cl .sec-h{color:#fff;margin-bottom:12px}
.c-sub{font-size:.92rem;line-height:1.8;color:rgba(255,255,255,.55)}
.c-note{font-size:.75rem;color:rgba(255,255,255,.3);margin-top:14px}

/* FOOTER */
footer{background:#060D1A;padding:38px 32px;border-top:1px solid rgba(191,160,84,.2)}
.fi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.fl{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:#fff}
.fl span{color:var(--gold)}
.ft{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:4px}
.fc-copy{font-size:.74rem;color:rgba(255,255,255,.28)}

@media(max-width:900px){
  .nav-links{display:none}.burger{display:flex}
  .stats-i{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}.stat:nth-child(3){border-right:1px solid rgba(255,255,255,.08)}
  .svc-top{flex-direction:column;align-items:flex-start}
  .svc-grid{grid-template-columns:1fr 1fr}
  .about-grid{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr}
  .wi{border-right:none!important;border-bottom:1px solid rgba(255,255,255,.1)!important}
  .wi:last-child{border-bottom:none!important}
  .contact-box{flex-direction:column;padding:48px 32px;text-align:center}
  .cl{max-width:100%}
}
@media(max-width:600px){
  .svc-grid{grid-template-columns:1fr}
  .hero{padding:120px 24px 80px}
  section{padding:72px 24px}
  .contact-box{padding:40px 24px}
  .stats-i{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<nav>
  <div class="nav-i">
    <a href="#home" class="logo">Strat<span>GO</span></a>
    <div class="nav-links">
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#why">Why Us</a>
      <a href="#contact" class="nav-cta">Contact Us</a>
    </div>
    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
<div class="mob" id="mob">
  <a href="#services" onclick="closeMob()">Services</a>
  <a href="#about" onclick="closeMob()">About</a>
  <a href="#why" onclick="closeMob()">Why Us</a>
  <a href="#contact" onclick="closeMob()">Contact Us →</a>
</div>

<div id="app"></div>

<script>
const D={
  meta:{title:"StratGO Consulting"},
  hero:{eyebrow:"Management Consulting",headline:"We Transform Businesses Into Market Leaders",sub:"StratGO Consulting partners with organizations to solve their most complex challenges, unlock growth, and build enduring competitive advantage.",cta:"Start a Conversation"},
  stats:[{value:"50+",label:"Projects Delivered"},{value:"15+",label:"Industries Served"},{value:"100%",label:"Senior-Led Engagements"},{value:"24h",label:"Response Guarantee"}],
  services:[
    {title:"Corporate Strategy",desc:"Sharpening competitive positioning, portfolio decisions, and long-range growth roadmaps for sustained market leadership."},
    {title:"Operations Excellence",desc:"Redesigning processes and supply chains to eliminate waste, increase throughput, and build operational resilience."},
    {title:"Data & Analytics",desc:"Transforming raw data into strategic intelligence through advanced analytics, dashboards, and AI-driven decision frameworks."},
    {title:"Business Transformation",desc:"End-to-end change programs that align people, processes, and technology to deliver lasting organizational impact."},
    {title:"IT & Digital",desc:"Technology strategy, digital architecture, and systems implementation that accelerate your digital transformation journey."},
    {title:"Management Advisory",desc:"Leadership advisory, organizational design, and performance management frameworks built for high-growth enterprises."}
  ],
  about:{
    intro:"StratGO was founded on a simple belief: great strategy is only as good as its execution. We combine rigorous analytical thinking with hands-on implementation expertise to deliver outcomes that last.",
    founders:[
      {name:"Prateek Varshney",role:"Co-Founder & Managing Partner",bio:"A seasoned strategist with deep expertise in corporate strategy and business transformation. Prateek brings a track record of delivering measurable outcomes across industries, combining analytical rigor with practical execution.",linkedin:"https://www.linkedin.com/in/prateekvarshney28/"},
      {name:"Kshitij Rohilla",role:"Co-Founder & Managing Partner",bio:"An operations and analytics expert who bridges the gap between data-driven insight and practical execution. Kshitij specializes in turning complex, ambiguous problems into scalable, repeatable solutions.",linkedin:"https://www.linkedin.com/in/kshitijrohilla/"}
    ]
  },
  why:[
    {label:"Outcome-Driven",text:"Every engagement is structured around measurable business outcomes — not just deliverables or slide decks."},
    {label:"Senior-Led",text:"Our founders personally lead every engagement. You get their expertise, not a hand-off to junior consultants."},
    {label:"Cross-Industry",text:"Deep experience across financial services, technology, healthcare, consumer, and industrial sectors."},
    {label:"Agile Delivery",text:"Rapid deployment with built-in feedback loops that adapt to your evolving business reality."}
  ],
  contact:{heading:"Start a Conversation",sub:"Tell us about your business challenge. We'll respond within 24 hours.",formUrl:"https://forms.gle/REPLACE",formCta:"Reach Out to Us"},
  footer:{tagline:"Strategy. Execution. Results.",copy:"2025 StratGO Consulting. All rights reserved."}
};

const LI='<svg class="li-icon" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';

function ini(n){return n.split(' ').map(w=>w[0]).join('')}

function render(c){
  document.title=c.meta.title;
  const hl=c.hero.headline.replace('Market Leaders','<em>Market Leaders</em>');
  document.getElementById('app').innerHTML=`
<section class="hero" id="home">
  <div class="hero-i">
    <div class="eyebrow">${c.hero.eyebrow}</div>
    <h1>${hl}</h1>
    <p class="hero-sub">${c.hero.sub}</p>
    <a href="#contact" class="btn">${c.hero.cta}</a>
  </div>
</section>

<div class="stats"><div class="stats-i">${c.stats.map(s=>`<div class="stat"><div class="stat-v">${s.value}</div><div class="stat-l">${s.label}</div></div>`).join('')}</div></div>

<section id="services">
  <div class="si">
    <div class="svc-top">
      <div><div class="sec-ey">What We Do</div><h2 class="sec-h">Our Services</h2></div>
      <p class="sec-sub">From strategic clarity to operational excellence — we cover the full spectrum of business transformation.</p>
    </div>
    <div class="svc-grid">${c.services.map((s,i)=>`<div class="svc-card"><div class="svc-n">0${i+1}</div><div class="svc-t">${s.title}</div><div class="svc-d">${s.desc}</div><span class="svc-line"></span></div>`).join('')}</div>
  </div>
</section>

<section class="about-bg" id="about">
  <div class="si">
    <div class="sec-ey">Our Firm</div>
    <h2 class="sec-h">About StratGO</h2>
    <p class="sec-sub" style="max-width:680px">${c.about.intro}</p>
    <div class="about-grid">${c.about.founders.map(f=>`<div class="fc"><div class="fc-ini">${ini(f.name)}</div><div class="fc-name">${f.name}</div><div class="fc-role">${f.role}</div><p class="fc-bio">${f.bio}</p><a href="${f.linkedin}" target="_blank" rel="noopener" class="li-btn">${LI}View on LinkedIn</a></div>`).join('')}</div>
  </div>
</section>

<section class="why-bg" id="why">
  <div class="si">
    <div class="sec-ey">Our Difference</div>
    <h2 class="sec-h">Why StratGO</h2>
    <div class="why-grid">${c.why.map(w=>`<div class="wi"><div class="wi-l">${w.label}</div><div class="wi-t">${w.text}</div></div>`).join('')}</div>
  </div>
</section>

<section id="contact">
  <div class="si">
    <div class="contact-box">
      <div class="cl">
        <div class="sec-ey">Get In Touch</div>
        <h2 class="sec-h">${c.contact.heading}</h2>
        <p class="c-sub">${c.contact.sub}</p>
        <p class="c-note">We review every submission personally and respond within 24 hours.</p>
      </div>
      <a href="${c.contact.formUrl}" target="_blank" rel="noopener" class="btn">${c.contact.formCta}</a>
    </div>
  </div>
</section>

<footer>
  <div class="fi">
    <div><div class="fl">Strat<span>GO</span></div><div class="ft">${c.footer.tagline}</div></div>
    <div class="fc-copy">© ${c.footer.copy}</div>
  </div>
</footer>`;}

document.getElementById('burger').onclick=()=>{
  const m=document.getElementById('mob');
  m.style.display=m.style.display==='block'?'none':'block';
};
function closeMob(){document.getElementById('mob').style.display='none';}

(async()=>{
  let c=D;
  try{const r=await fetch('content.json?v='+Date.now());if(r.ok)c=await r.json();}catch(e){}
  render(c);
})();
</script>
</body>
</html>
