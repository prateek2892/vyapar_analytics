<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StratGO Consulting</title>
<meta name="description" content="StratGO Consulting — Strategy, Operations, Analytics, Transformation, IT and Management Advisory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1426;--navy2:#111e36;--navy3:#162444;
  --gold:#BFA054;--gold-l:#D4B76A;--gold-d:#9A7F3C;
  --gold-glow:rgba(191,160,84,.25);
  --white:#fff;--off:#F6F4EF;--gray:#6B7A99;--text:#1A2233;--border:#E4E0D6;
  --shadow-sm:0 2px 12px rgba(11,20,38,.08);
  --shadow-md:0 8px 32px rgba(11,20,38,.14);
  --shadow-lg:0 20px 60px rgba(11,20,38,.2);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* ── SCROLL ANIMATIONS ── */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:none}
.reveal-l{opacity:0;transform:translateX(-32px);transition:opacity .7s .1s cubic-bezier(.22,1,.36,1),transform .7s .1s cubic-bezier(.22,1,.36,1)}
.reveal-l.visible{opacity:1;transform:none}
.reveal-r{opacity:0;transform:translateX(32px);transition:opacity .7s .1s cubic-bezier(.22,1,.36,1),transform .7s .1s cubic-bezier(.22,1,.36,1)}
.reveal-r.visible{opacity:1;transform:none}
.stagger-1{transition-delay:.05s!important}
.stagger-2{transition-delay:.15s!important}
.stagger-3{transition-delay:.25s!important}
.stagger-4{transition-delay:.35s!important}
.stagger-5{transition-delay:.45s!important}
.stagger-6{transition-delay:.55s!important}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .4s,backdrop-filter .4s,box-shadow .4s}
nav.top{background:transparent}
nav.scrolled{background:rgba(11,20,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(191,160,84,.2),var(--shadow-md)}
.nav-i{max-width:1240px;margin:0 auto;padding:0 40px;height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:0}
.logo .go{color:var(--gold);position:relative}
.logo .go::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.logo:hover .go::after{transform:scaleX(1)}
.nav-links{display:flex;gap:36px;align-items:center}
.nav-links a{font-size:.8rem;font-weight:500;color:rgba(255,255,255,.65);letter-spacing:.08em;text-transform:uppercase;transition:color .2s;position:relative;padding-bottom:2px}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-cta{background:var(--gold)!important;color:var(--navy)!important;padding:10px 24px;font-weight:700!important;letter-spacing:.06em!important;transition:all .25s!important;box-shadow:0 4px 16px rgba(191,160,84,.3)!important}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--gold-l)!important;transform:translateY(-1px)!important;box-shadow:0 6px 24px rgba(191,160,84,.45)!important}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none}
.burger span{display:block;width:24px;height:2px;background:#fff;transition:.3s;transform-origin:center}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mob{display:none;position:fixed;top:72px;left:0;right:0;background:rgba(11,20,38,.97);backdrop-filter:blur(20px);padding:24px 40px 32px;border-bottom:1px solid rgba(191,160,84,.2);z-index:199;transform:translateY(-10px);opacity:0;transition:transform .3s,opacity .3s}
.mob.open{display:block;transform:none;opacity:1}
.mob a{display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-size:.9rem;font-weight:500;color:rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.06);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.mob a:last-child{border:none;color:var(--gold);font-weight:700;margin-top:8px}
.mob a:hover{color:var(--gold)}

/* ── HERO ── */
.hero{background:var(--navy);padding:148px 40px 120px;min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden}
/* Animated gradient orbs */
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(80px)}
.hero-orb-1{width:700px;height:700px;top:-20%;right:-15%;background:radial-gradient(circle,rgba(191,160,84,.09) 0%,transparent 65%);animation:float1 8s ease-in-out infinite}
.hero-orb-2{width:400px;height:400px;bottom:-10%;left:-5%;background:radial-gradient(circle,rgba(21,32,64,.8) 0%,transparent 70%);animation:float2 10s ease-in-out infinite}
.hero-orb-3{width:300px;height:300px;top:40%;left:45%;background:radial-gradient(circle,rgba(191,160,84,.05) 0%,transparent 70%);animation:float1 12s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
/* Grid overlay */
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,var(--gold) 50%,transparent 100%)}
.hero-i{max-width:1240px;margin:0 auto;width:100%;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:32px;opacity:0;animation:fadeUp .8s .2s forwards}
.eyebrow::before{content:'';display:block;width:36px;height:1px;background:var(--gold)}
.eyebrow::after{content:'';display:block;width:36px;height:1px;background:var(--gold)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,6.5vw,5.2rem);font-weight:700;line-height:1.08;color:#fff;max-width:820px;margin-bottom:30px;opacity:0;animation:fadeUp .8s .4s forwards}
.hero h1 em{font-style:italic;color:var(--gold);position:relative;display:inline-block}
.hero h1 em::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);transform:scaleX(0);transform-origin:left;animation:underlineIn .6s 1.2s forwards}
@keyframes underlineIn{to{transform:scaleX(1)}}
.hero-sub{font-size:1.08rem;font-weight:300;line-height:1.85;color:rgba(255,255,255,.58);max-width:560px;margin-bottom:52px;opacity:0;animation:fadeUp .8s .6s forwards}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fadeUp .8s .8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* Scroll indicator */
.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.4;animation:fadeUp .8s 1.4s both}
.scroll-hint span{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.scroll-mouse{width:22px;height:34px;border:1.5px solid rgba(255,255,255,.4);border-radius:11px;position:relative}
.scroll-mouse::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:3px;height:7px;background:var(--gold);border-radius:2px;animation:scrollDot 1.8s ease-in-out infinite}
@keyframes scrollDot{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}80%{transform:translateX(-50%) translateY(12px);opacity:0}}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--navy);font-size:.88rem;font-weight:700;padding:15px 32px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;font-family:inherit;position:relative;overflow:hidden;transition:color .2s,box-shadow .3s,transform .2s}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.2) 50%,transparent 100%);transform:translateX(-100%);transition:transform .5s}
.btn:hover::before{transform:translateX(100%)}
.btn:hover{background:var(--gold-l);box-shadow:0 8px 32px rgba(191,160,84,.5);transform:translateY(-2px)}
.btn .arr{transition:transform .3s}
.btn:hover .arr{transform:translateX(4px)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);box-shadow:none}
.btn-ghost::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.btn-ghost:hover{background:rgba(255,255,255,.06);box-shadow:0 4px 20px rgba(0,0,0,.3);border-color:rgba(255,255,255,.5)}

/* ── STATS ── */
.stats{background:linear-gradient(135deg,var(--navy2) 0%,var(--navy3) 100%);padding:0 40px;border-top:1px solid rgba(191,160,84,.15);position:relative}
.stats::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23BFA054' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.stats-i{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;padding:48px 20px;border-right:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;transition:background .3s}
.stat:last-child{border-right:none}
.stat::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--gold);transition:width .4s}
.stat:hover::before{width:60%}
.stat:hover{background:rgba(255,255,255,.03)}
.stat-v{font-family:'Playfair Display',serif;font-size:3rem;font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(191,160,84,.3)}
.stat-l{font-size:.68rem;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-top:10px}

/* ── SECTIONS ── */
section{padding:108px 40px}
.si{max-width:1240px;margin:0 auto}
.sec-ey{font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-ey::before{content:'';display:block;width:24px;height:1px;background:var(--gold)}
.sec-h{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,4vw,3rem);font-weight:700;line-height:1.18;color:var(--navy);margin-bottom:20px}
.sec-sub{font-size:.96rem;line-height:1.85;color:var(--gray);max-width:560px}

/* ── SERVICES ── */
#services{background:var(--white);position:relative}
#services::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.svc-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:60px;gap:40px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.svc-card{padding:44px 36px;border:1px solid var(--border);margin:-1px 0 0 -1px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,background .3s;cursor:default;background:var(--white)}
.svc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.svc-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(191,160,84,.04) 0%,transparent 60%);opacity:0;transition:opacity .4s}
.svc-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);z-index:1;background:#FEFDFB}
.svc-card:hover::before{transform:scaleX(1)}
.svc-card:hover::after{opacity:1}
.svc-n{font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.14em;margin-bottom:22px;opacity:.7;font-variant-numeric:tabular-nums}
.svc-t{font-family:'Playfair Display',serif;font-size:1.22rem;font-weight:700;color:var(--navy);margin-bottom:14px;line-height:1.3;transition:color .2s}
.svc-card:hover .svc-t{color:var(--gold-d)}
.svc-d{font-size:.86rem;line-height:1.82;color:var(--gray)}
.svc-line{display:block;width:28px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-l));margin-top:26px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.svc-card:hover .svc-line{width:60px}

/* ── ABOUT ── */
.about-bg{background:var(--off);position:relative;overflow:hidden}
.about-bg::before{content:'';position:absolute;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(191,160,84,.04) 0%,transparent 70%);pointer-events:none}
.about-intro-wrap{display:flex;align-items:center;gap:48px;margin-bottom:60px}
.about-line{flex-shrink:0;width:3px;height:80px;background:linear-gradient(180deg,var(--gold),transparent)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.fc{background:var(--white);padding:44px 40px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.fc::before{content:'';position:absolute;top:0;left:0;right:0;height:100%;background:linear-gradient(180deg,rgba(191,160,84,.04) 0%,transparent 40%);opacity:0;transition:opacity .4s}
.fc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.fc:hover::before{opacity:1}
.fc-top{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}
.fc-ini{width:58px;height:58px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--gold);flex-shrink:0;box-shadow:0 4px 16px rgba(11,20,38,.25);border-bottom:2px solid var(--gold)}
.fc-head{}
.fc-name{font-family:'Playfair Display',serif;font-size:1.38rem;font-weight:700;color:var(--navy);line-height:1.2}
.fc-role{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:5px}
.fc-bio{font-size:.88rem;line-height:1.85;color:var(--gray);margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid var(--border)}
.li-btn{display:inline-flex;align-items:center;gap:9px;font-size:.79rem;font-weight:700;color:var(--navy);border:1.5px solid var(--navy);padding:10px 18px;letter-spacing:.05em;text-transform:uppercase;transition:all .25s;position:relative;overflow:hidden}
.li-btn::before{content:'';position:absolute;inset:0;background:var(--navy);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.li-btn:hover::before{transform:scaleX(1)}
.li-btn:hover{color:#fff}
.li-btn>*{position:relative;z-index:1}
.li-icon{width:15px;height:15px;fill:currentColor;flex-shrink:0;transition:fill .25s}

/* ── WHY ── */
.why-bg{background:linear-gradient(145deg,var(--navy) 0%,#0d1e3a 100%);position:relative;overflow:hidden}
.why-bg::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23BFA054' fill-opacity='0.03'%3E%3Cpath fill-rule='evenodd' d='M0 0h40v40H0V0zm40 40h40v40H40V40zm0-40h2l-2 2V0zm0 4l4-4h2l-6 6V4zm0 4l8-8h2L40 10V8zm0 4L52 0h2L40 14v-2zm0 4L56 0h2L40 18v-2zm0 4L60 0h2L40 22v-2zm0 4L64 0h2L40 26v-2zm0 4L68 0h2L40 30v-2zm0 4L72 0h2L40 34v-2zm0 4L76 0h2L40 38v-2zm0 4L80 0v2L42 40h-2zm4 0L80 4v2L46 40h-2zm4 0L80 8v2L50 40h-2zm4 0l28-28v2L54 40h-2zm4 0l24-24v2L58 40h-2zm4 0l20-20v2L62 40h-2zm4 0l16-16v2L66 40h-2zm4 0l12-12v2L70 40h-2zm4 0l8-8v2l-6 6h-2zm4 0l4-4v2l-2 2h-2z'/%3E%3C/g%3E%3C/svg%3E");opacity:.5}
.why-bg .sec-h{color:#fff}
.why-bg .sec-ey::before{background:var(--gold)}
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:56px;border:1px solid rgba(255,255,255,.08)}
.wi{padding:48px 44px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;transition:background .3s}
.wi::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--gold);transition:height .4s cubic-bezier(.22,1,.36,1)}
.wi:hover{background:rgba(255,255,255,.03)}
.wi:hover::before{height:100%}
.wi:nth-child(2n){border-right:none}
.wi:nth-child(3),.wi:nth-child(4){border-bottom:none}
.wi-num{font-family:'Playfair Display',serif;font-size:3rem;font-weight:700;color:rgba(191,160,84,.1);line-height:1;margin-bottom:16px;transition:color .3s}
.wi:hover .wi-num{color:rgba(191,160,84,.2)}
.wi-l{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.wi-t{font-size:.92rem;line-height:1.85;color:rgba(255,255,255,.52)}

/* ── CONTACT ── */
#contact{background:var(--off);padding:108px 40px}
.contact-box{background:linear-gradient(135deg,var(--navy) 0%,#0d1e3a 60%,#162030 100%);padding:80px 72px;display:flex;align-items:center;justify-content:space-between;gap:56px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.contact-box::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(191,160,84,.08) 0%,transparent 60%);pointer-events:none}
.contact-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.cl{max-width:560px;position:relative;z-index:1}
.cl .sec-h{color:#fff;margin-bottom:14px}
.cl .sec-ey{color:var(--gold)}
.cl .sec-ey::before{background:var(--gold)}
.c-sub{font-size:.95rem;line-height:1.85;color:rgba(255,255,255,.55)}
.c-note{display:flex;align-items:center;gap:8px;font-size:.74rem;color:rgba(255,255,255,.3);margin-top:18px}
.c-note::before{content:'';display:block;width:16px;height:1px;background:rgba(255,255,255,.2);flex-shrink:0}
.contact-cta{position:relative;z-index:1;flex-shrink:0}
/* Pulsing ring around contact button */
.btn-pulse{position:relative}
.btn-pulse::after{content:'';position:absolute;inset:-6px;border:1px solid rgba(191,160,84,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.05);opacity:1}}

/* ── FOOTER ── */
footer{background:#050D1A;padding:48px 40px;border-top:1px solid rgba(191,160,84,.15)}
.fi{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.fl{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:.02em}
.fl .go{color:var(--gold)}
.ft{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:6px}
.fc-copy{font-size:.74rem;color:rgba(255,255,255,.25);text-align:right}
.footer-links{display:flex;gap:24px}
.footer-links a{font-size:.76rem;color:rgba(255,255,255,.3);letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.footer-links a:hover{color:var(--gold)}

/* ── RESPONSIVE ── */
@media(max-width:960px){
  .nav-links{display:none}.burger{display:flex}
  .stats-i{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}.stat:nth-child(3){border-right:1px solid rgba(255,255,255,.07)}
  .svc-top{flex-direction:column;align-items:flex-start;margin-bottom:40px}
  .svc-grid{grid-template-columns:1fr 1fr}
  .about-grid{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr}
  .wi{border-right:none!important;border-bottom:1px solid rgba(255,255,255,.08)!important}
  .wi:last-child{border-bottom:none!important}
  .contact-box{flex-direction:column;padding:56px 40px;text-align:center;align-items:center}
  .cl{max-width:100%}
  .c-note{justify-content:center}
  section{padding:80px 32px}
  .nav-i{padding:0 28px}
}
@media(max-width:600px){
  .svc-grid{grid-template-columns:1fr}
  .hero{padding:130px 24px 100px}
  section{padding:72px 24px}
  .contact-box{padding:44px 28px}
  .stats-i{grid-template-columns:repeat(2,1fr)}
  .about-intro-wrap{flex-direction:column;gap:20px}
  .about-line{width:60px;height:3px}
  .fi{flex-direction:column;text-align:center;gap:16px}
  .fc-copy{text-align:center}
  .footer-links{justify-content:center}
}
</style>
</head>
<body>

<nav class="top" id="navbar">
  <div class="nav-i">
    <a href="#home" class="logo">Strat<span class="go">GO</span></a>
    <div class="nav-links">
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#why">Why Us</a>
      <a href="#contact" class="nav-cta">Contact Us</a>
    </div>
    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
<div class="mob" id="mob">
  <a href="#services" onclick="closeMob()">Services</a>
  <a href="#about" onclick="closeMob()">About</a>
  <a href="#why" onclick="closeMob()">Why Us</a>
  <a href="#contact" onclick="closeMob()">Contact Us →</a>
</div>

<div id="app"></div>

<script>
const D={
  meta:{title:"StratGO Consulting"},
  hero:{eyebrow:"Management Consulting",headline:"We Transform Businesses Into Market Leaders",sub:"StratGO Consulting partners with organizations to solve their most complex challenges, unlock growth, and build enduring competitive advantage.",cta:"Start a Conversation"},
  stats:[{value:"50+",label:"Projects Delivered"},{value:"15+",label:"Industries Served"},{value:"100%",label:"Senior-Led Engagements"},{value:"24h",label:"Response Guarantee"}],
  services:[
    {title:"Corporate Strategy",desc:"Sharpening competitive positioning, portfolio decisions, and long-range growth roadmaps for sustained market leadership."},
    {title:"Operations Excellence",desc:"Redesigning processes and supply chains to eliminate waste, increase throughput, and build operational resilience."},
    {title:"Data & Analytics",desc:"Transforming raw data into strategic intelligence through advanced analytics, dashboards, and AI-driven decision frameworks."},
    {title:"Business Transformation",desc:"End-to-end change programs that align people, processes, and technology to deliver lasting organizational impact."},
    {title:"IT & Digital",desc:"Technology strategy, digital architecture, and systems implementation that accelerate your digital transformation journey."},
    {title:"Management Advisory",desc:"Leadership advisory, organizational design, and performance management frameworks built for high-growth enterprises."}
  ],
  about:{
    intro:"StratGO was founded on a simple belief: great strategy is only as good as its execution. We combine rigorous analytical thinking with hands-on implementation expertise to deliver outcomes that last.",
    founders:[
      {name:"Prateek Varshney",role:"Co-Founder & Managing Partner",bio:"A seasoned strategist with deep expertise in corporate strategy and business transformation. Prateek brings a track record of delivering measurable outcomes across industries, combining analytical rigor with practical execution.",linkedin:"https://www.linkedin.com/in/prateekvarshney28/"},
      {name:"Kshitij Rohilla",role:"Co-Founder & Managing Partner",bio:"An operations and analytics expert who bridges the gap between data-driven insight and practical execution. Kshitij specializes in turning complex, ambiguous problems into scalable, repeatable solutions.",linkedin:"https://www.linkedin.com/in/kshitijrohilla/"}
    ]
  },
  why:[
    {label:"Outcome-Driven",text:"Every engagement is structured around measurable business outcomes — not just deliverables or slide decks."},
    {label:"Senior-Led",text:"Our founders personally lead every engagement. You get their expertise, not a hand-off to junior consultants."},
    {label:"Cross-Industry",text:"Deep experience across financial services, technology, healthcare, consumer, and industrial sectors."},
    {label:"Agile Delivery",text:"Rapid deployment with built-in feedback loops that adapt to your evolving business reality."}
  ],
  contact:{heading:"Start a Conversation",sub:"Tell us about your business challenge. We'll respond within 24 hours.",formUrl:"https://forms.gle/REPLACE",formCta:"Reach Out to Us"},
  footer:{tagline:"Strategy. Execution. Results.",copy:"2025 StratGO Consulting. All rights reserved."}
};

const LI='<svg class="li-icon" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
function ini(n){return n.split(' ').map(w=>w[0]).join('')}

function render(c){
  document.title=c.meta.title;
  const hl=c.hero.headline.replace('Market Leaders','<em>Market Leaders</em>');
  document.getElementById('app').innerHTML=`
<section class="hero" id="home">
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>
  <div class="hero-orb hero-orb-3"></div>
  <div class="hero-grid"></div>
  <div class="hero-i">
    <div class="eyebrow">${c.hero.eyebrow}</div>
    <h1>${hl}</h1>
    <p class="hero-sub">${c.hero.sub}</p>
    <div class="hero-btns">
      <a href="#contact" class="btn"><span>${c.hero.cta}</span><span class="arr">→</span></a>
      <a href="#services" class="btn btn-ghost"><span>Our Services</span></a>
    </div>
  </div>
  <div class="scroll-hint">
    <div class="scroll-mouse"></div>
    <span>Scroll</span>
  </div>
</section>

<div class="stats">
  <div class="stats-i">
    ${c.stats.map(s=>`<div class="stat reveal"><div class="stat-v">${s.value}</div><div class="stat-l">${s.label}</div></div>`).join('')}
  </div>
</div>

<section id="services">
  <div class="si">
    <div class="svc-top">
      <div class="reveal-l">
        <div class="sec-ey">What We Do</div>
        <h2 class="sec-h">Our Services</h2>
      </div>
      <p class="sec-sub reveal-r">From strategic clarity to operational excellence — we cover the full spectrum of business transformation.</p>
    </div>
    <div class="svc-grid">
      ${c.services.map((s,i)=>`
      <div class="svc-card reveal stagger-${i+1}">
        <div class="svc-n">0${i+1}</div>
        <div class="svc-t">${s.title}</div>
        <div class="svc-d">${s.desc}</div>
        <span class="svc-line"></span>
      </div>`).join('')}
    </div>
  </div>
</section>

<section class="about-bg" id="about">
  <div class="si">
    <div class="reveal">
      <div class="sec-ey">Our Firm</div>
      <h2 class="sec-h">About StratGO</h2>
    </div>
    <div class="about-intro-wrap reveal">
      <div class="about-line"></div>
      <p class="sec-sub" style="max-width:700px;font-size:1.02rem">${c.about.intro}</p>
    </div>
    <div class="about-grid">
      ${c.about.founders.map((f,i)=>`
      <div class="fc reveal stagger-${i+1}">
        <div class="fc-top">
          <div class="fc-ini">${ini(f.name)}</div>
          <div class="fc-head">
            <div class="fc-name">${f.name}</div>
            <div class="fc-role">${f.role}</div>
          </div>
        </div>
        <p class="fc-bio">${f.bio}</p>
        <a href="${f.linkedin}" target="_blank" rel="noopener" class="li-btn">
          ${LI}<span>View on LinkedIn</span>
        </a>
      </div>`).join('')}
    </div>
  </div>
</section>

<section class="why-bg" id="why">
  <div class="si">
    <div class="reveal">
      <div class="sec-ey">Our Difference</div>
      <h2 class="sec-h">Why StratGO</h2>
    </div>
    <div class="why-grid">
      ${c.why.map((w,i)=>`
      <div class="wi reveal stagger-${i+1}">
        <div class="wi-num">0${i+1}</div>
        <div class="wi-l">${w.label}</div>
        <div class="wi-t">${w.text}</div>
      </div>`).join('')}
    </div>
  </div>
</section>

<section id="contact">
  <div class="si">
    <div class="contact-box reveal">
      <div class="cl">
        <div class="sec-ey">Get In Touch</div>
        <h2 class="sec-h">${c.contact.heading}</h2>
        <p class="c-sub">${c.contact.sub}</p>
        <p class="c-note">We review every submission personally and respond within 24 hours.</p>
      </div>
      <div class="contact-cta">
        <a href="${c.contact.formUrl}" target="_blank" rel="noopener" class="btn btn-pulse">
          <span>${c.contact.formCta}</span><span class="arr">→</span>
        </a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="fi">
    <div>
      <div class="fl">Strat<span class="go">GO</span></div>
      <div class="ft">${c.footer.tagline}</div>
    </div>
    <div class="footer-links">
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
    <div class="fc-copy">© ${c.footer.copy}</div>
  </div>
</footer>`;

  initScrollAnimations();
}

/* ── SCROLL ANIMATIONS ── */
function initScrollAnimations(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}})
  },{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal,.reveal-l,.reveal-r').forEach(el=>io.observe(el));
}

/* ── NAV SCROLL ── */
window.addEventListener('scroll',()=>{
  const nav=document.getElementById('navbar');
  nav.className=window.scrollY>60?'scrolled':'top';
},{ passive:true });

/* ── BURGER ── */
document.getElementById('burger').onclick=function(){
  const m=document.getElementById('mob');
  this.classList.toggle('open');
  m.classList.toggle('open');
};
function closeMob(){
  document.getElementById('mob').classList.remove('open');
  document.getElementById('burger').classList.remove('open');
}

(async()=>{
  let c=D;
  try{const r=await fetch('content.json?v='+Date.now());if(r.ok)c=await r.json();}catch(e){}
  render(c);
})();
</script>
</body>
</html>
